<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo SysInfo Lite : carré arrondi violet en dégradé, puce blanche -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7dff"/>
      <stop offset="0.55" stop-color="#6a45f7"/>
      <stop offset="1" stop-color="#4a26e0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#shine)"/>
  <!-- Puce (même dessin que l'icône de l'application, agrandie) -->
  <g transform="translate(106 106) scale(12.5)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="5" width="14" height="14" rx="2.4"/>
    <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
  </g>
  <!-- Cœur de la puce en dégradé cyan → rose -->
  <rect x="219" y="219" width="74" height="74" rx="16" fill="url(#spark)"/>
</svg>
