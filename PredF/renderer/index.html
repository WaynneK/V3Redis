<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- 100 % local : rien d'autre que le protocole interne de PredF (aucune ressource externe, aucune connexion) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PredF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.svg" alt="" class="brand-logo" />
        <div>
          <h1>Pred<span>F</span></h1>
          <p class="brand-sub">Fusion et conversion de PDF</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="badge offline" data-tip="Tous les outils fonctionnent sans Internet : vos fichiers restent sur cet ordinateur. Seul l'Assistant IA, quand vous le lancez, envoie les documents choisis à l'API Claude d'Anthropic.">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0" /><path d="M3 3l18 18" /></svg>
          100 % local
        </span>
        <button id="theme" class="btn ghost" type="button"><span>Thème : système</span></button>
      </div>
    </header>

    <div class="shell">
      <nav class="sidebar" aria-label="Outils">
        <div class="tools" id="tools" role="tablist" aria-orientation="vertical" aria-label="Outils"></div>
        <div class="sidebar-foot">
          <span id="version">PredF</span>
          <span class="muted">Glissez vos fichiers n'importe où dans la fenêtre</span>
        </div>
      </nav>

      <main class="workspace" id="workspace">
        <div class="workspace-inner">
          <div class="tool-head">
            <span class="tool-icon" id="tool-icon" aria-hidden="true"></span>
            <div>
              <h2 id="tool-title"></h2>
              <p id="tool-desc"></p>
            </div>
          </div>
          <div id="workspace-panels"></div>
        </div>
      </main>
    </div>

    <!-- Dépôt de fichiers -->
    <div class="drop-overlay" aria-hidden="true">
      <div class="drop-card">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>
        <strong>Déposez vos fichiers</strong>
        <span>dans « <span id="drop-tool"></span> »</span>
      </div>
    </div>

    <!-- Traitement en cours -->
    <div class="busy" id="busy" hidden>
      <div class="busy-card" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <strong id="busy-label">Traitement…</strong>
        <div class="busy-track"><span id="busy-bar"></span></div>
        <span class="muted" id="busy-detail"></span>
        <button id="busy-cancel" class="btn small ghost" type="button" hidden>Annuler</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <script src="/lib/ranges.js"></script>
    <script src="/lib/markdown.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
