<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- 100 % local : aucune ressource externe, aucune connexion. style-src 'unsafe-inline' : l'aperçu des
         fiches (docx-preview) ajoute les styles du document Word dans la page. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FichInter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button type="button" class="brand" id="home-link" title="Modèles et fiches récentes">
        <img src="assets/logo.svg" alt="" class="brand-logo" />
        <span class="brand-text">
          <strong>FichInter</strong>
          <small>Vos fiches d'intervention</small>
        </span>
      </button>

      <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>

      <div class="theme" role="radiogroup" aria-label="Thème">
        <button type="button" role="radio" data-theme="system" title="Thème du système" aria-label="Thème du système">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2" /><path d="M8.5 20h7M12 16.5V20" /></svg>
        </button>
        <button type="button" role="radio" data-theme="light" title="Thème clair" aria-label="Thème clair">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg>
        </button>
        <button type="button" role="radio" data-theme="dark" title="Thème sombre" aria-label="Thème sombre">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        </button>
      </div>
    </header>

    <!-- Vues construites par app.js : modèles (accueil), formulaire, fiche générée -->
    <main class="main" id="main" tabindex="-1"></main>

    <div class="modal-layer" id="modal" hidden></div>
    <div class="busy" id="busy" hidden>
      <div class="busy-card" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p id="busy-text">Génération de la fiche…</p>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!-- Export PDF sans Word : copie de l'aperçu, seule visible à l'impression -->
    <div class="print-area" id="print-area" aria-hidden="true"></div>

    <!-- Aperçu des documents Word, hors ligne -->
    <script src="../node_modules/jszip/dist/jszip.min.js"></script>
    <script src="../node_modules/docx-preview/dist/docx-preview.min.js"></script>
    <script src="../lib/fields.js"></script>
    <script src="app.js"></script>
  </body>
</html>
